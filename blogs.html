<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blogs & Updates | NewVemo Technology</title><link rel="icon" type="image/png" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"><meta name="description" content="News, tips and product updates on websites, software, mobile apps and business technology from NewVemo Technology."><meta name="robots" content="index, follow, max-image-preview:large"><link rel="canonical" href="https://YOUR-DOMAIN/blogs.html"><meta property="og:type" content="website"><meta property="og:site_name" content="NewVemo Technology"><meta property="og:title" content="Blogs & Updates | NewVemo Technology"><meta property="og:description" content="News, tips and product updates on websites, software, mobile apps and business technology from NewVemo Technology."><meta property="og:url" content="https://YOUR-DOMAIN/blogs.html"><meta property="og:image" content="https://YOUR-DOMAIN/assets/og-image.png"><meta property="og:locale" content="en_US"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Blogs & Updates | NewVemo Technology"><meta name="twitter:description" content="News, tips and product updates on websites, software, mobile apps and business technology from NewVemo Technology."><meta name="twitter:image" content="https://YOUR-DOMAIN/assets/og-image.png"><meta name="theme-color" content="#0a1030"></head><body><section class="ph"><div class="wrap"><div class="bc"><a href="index.html">Home</a> / Blogs</div><h1>Blogs &amp; Updates</h1><p>News, tips and product updates from NewVemo Technology.</p></div></section>
<section><div class="wrap"><div class="tb"><div class="chips" id="chips"></div><input class="sr" id="q" type="search" placeholder="Search posts..."></div><div class="gd" id="list"><div class="em"><i class="fa-solid fa-spinner fa-spin"></i>Loading posts...</div></div></div></section>
<footer id="ftr"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/layout.js"></script><script>
(function(){var all=[],cat='all',list=document.getElementById('list'),E=NV.esc;
function card(p,i){return '<a class="cd rv" href="blog-post.html?slug='+encodeURIComponent(p.slug)+'"><div class="cv k'+(i%5)+'"><i class="fa-solid '+(NV.ICON[p.cover_icon]||'fa-newspaper')+'"></i><span class="cb">'+E(p.category||'news')+'</span></div><div class="cc"><div class="mt"><span><i class="fa-regular fa-calendar"></i>'+NV.date(p.published_at||p.created_at)+'</span><span><i class="fa-regular fa-clock"></i>'+(p.read_time_minutes||4)+' min read</span></div><h3>'+E(p.title)+'</h3><p>'+E(p.excerpt||'')+'</p><span style="margin-top:auto;color:var(--b);font-weight:700">Read more <i class="fa-solid fa-arrow-right"></i></span></div></a>'}
function draw(){var s=document.getElementById('q').value.toLowerCase();var rows=all.filter(function(p){return(cat=='all'||p.category==cat)&&((p.title||'')+' '+(p.excerpt||'')).toLowerCase().indexOf(s)>-1});
list.innerHTML=rows.length?rows.map(card).join(''):'<div class="em"><i class="fa-regular fa-newspaper"></i>No posts yet. Please check back soon.</div>';NVreveal()}
function chips(){var cs=['all'];all.forEach(function(p){if(p.category&&cs.indexOf(p.category)<0)cs.push(p.category)});
var h=document.getElementById('chips');h.innerHTML=cs.map(function(c){return'<button data-c="'+E(c)+'" class="'+(c==cat?'on':'')+'">'+(c=='all'?'All':E(c))+'</button>'}).join('');
h.querySelectorAll('button').forEach(function(b){b.onclick=function(){cat=b.dataset.c;chips();draw()}})}
document.getElementById('q').oninput=draw;
var sb=NV.client();if(!sb){list.innerHTML='<div class="em">Posts are unavailable right now.</div>';return}
sb.from('blog_posts').select('*').eq('is_published',true).in('site',['newvemo','both']).order('published_at',{ascending:false}).then(function(r){if(r.error){console.error(r.error);list.innerHTML='<div class="em">Could not load posts.</div>';return}all=r.data||[];chips();draw()});
})();
</script>
</body></html>
