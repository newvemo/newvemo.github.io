<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | NewVemo Technology</title><meta name="robots" content="noindex,nofollow"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="assets/style.css"></head><body>
<div id="toast"></div>
<div class="lg" id="login"><div class="box"><div class="lw"><img src="assets/logo.png" alt="NewVemo" height="52"></div><h3 style="font-size:22px">Admin sign in</h3><p style="color:var(--mu);margin-bottom:18px;font-size:14.5px">Sign in with your Supabase admin account.</p><form id="lf"><div class="fd"><label>Email</label><input type="email" id="le" required></div><div class="fd"><label>Password</label><input type="password" id="lp" required></div><button class="btn bp" style="width:100%">Sign in</button></form></div></div>
<div class="adm hid" id="app"><aside class="as"><div class="lw"><img src="assets/logo.png" alt="NewVemo" height="40"></div><button data-t="soft" class="on"><i class="fa-solid fa-box"></i>Software</button><button data-t="post"><i class="fa-solid fa-newspaper"></i>Posts</button><button id="out"><i class="fa-solid fa-right-from-bracket"></i>Sign out</button><button onclick="location.href='index.html'"><i class="fa-solid fa-house"></i>View site</button></aside>
<main class="am">
<div class="pn on" id="p-soft"><h2>Software uploads</h2>
<div class="box"><h3 id="sT">Add software release</h3><form id="sf"><input type="hidden" id="sId">
<div class="fr"><div class="fd"><label>Software name *</label><input id="sName" required placeholder="e.g. ShuleBrain DSK"></div><div class="fd"><label>Category *</label><select id="sCat"><option value="shulebrain">ShuleBrain (shows on ShuleBrain site and here)</option><option value="desktop">Desktop Software</option><option value="android">Android App</option><option value="web">Web Application</option><option value="tools">Tools &amp; Utilities</option><option value="other">Other</option></select></div></div>
<div class="fr"><div class="fd"><label>Version *</label><input id="sVer" required placeholder="v1.0.0"></div><div class="fd"><label>File name *</label><input id="sFile" required placeholder="MyApp-v1.0.0.zip"></div></div>
<div class="fr"><div class="fd"><label>File size (MB)</label><input id="sSize" type="number" step="0.01"></div><div class="fd"><label>Release date</label><input id="sDate" type="date"></div></div>
<div class="fd"><label>Download URL * (GitHub Release link)</label><input id="sUrl" required placeholder="https://github.com/.../releases/download/..."></div>
<div class="fd"><label>Short description</label><textarea id="sDesc" style="min-height:80px"></textarea></div>
<div class="fr"><div class="fd"><label>Features (one per line)</label><textarea id="sFeat" style="min-height:90px"></textarea></div><div class="fd"><label>Requirements (one per line)</label><textarea id="sReq" style="min-height:90px"></textarea></div></div>
<label style="display:flex;gap:8px;align-items:center;margin-bottom:16px;font-weight:600"><input type="checkbox" id="sLat" style="width:auto"> Mark as latest version of this software</label>
<button class="btn bp" id="sBtn">Save release</button> <button type="button" class="btn bl hid" id="sCancel">Cancel edit</button></form></div>
<div class="box"><h3>All releases <span class="bd" id="sCount"></span></h3><div style="overflow:auto"><table class="tbl"><thead><tr><th>Software</th><th>Category</th><th>Version</th><th>Date</th><th></th></tr></thead><tbody id="sRows"></tbody></table></div></div></div>
<div class="pn" id="p-post"><h2>Blog posts</h2>
<div class="box"><h3 id="pT">Create post</h3><form id="pf"><input type="hidden" id="pId">
<div class="fr"><div class="fd"><label>Title *</label><input id="pTitle" required></div><div class="fd"><label>Slug *</label><input id="pSlug" required placeholder="my-first-post"></div></div>
<div class="fr"><div class="fd"><label>Show on *</label><select id="pSite"><option value="newvemo">NewVemo website only</option><option value="shulebrain">ShuleBrain website only</option><option value="both">Both websites</option></select></div><div class="fd"><label>Category</label><input id="pCat" list="cats" value="news"><datalist id="cats"><option>news</option><option>tips</option><option>product</option><option>company</option><option>exams</option></datalist></div></div>
<div class="fr"><div class="fd"><label>Cover icon</label><select id="pIcon"><option>package</option><option>rocket</option><option>shield</option><option>code</option><option>globe</option><option>mobile</option><option>chart</option><option>bulb</option><option>school</option><option>news</option></select></div><div class="fd"><label>Author</label><input id="pAuth" value="NewVemo Team"></div></div>
<div class="fr"><div class="fd"><label>Read time (min)</label><input id="pRead" type="number" value="4" min="1"></div><div class="fd"><label>Excerpt</label><input id="pExc"></div></div>
<div class="fd"><label>Content (HTML) *</label><textarea id="pBody" required style="min-height:220px;font-family:monospace" placeholder="<p>Write your post here. You can use &lt;h2&gt;, &lt;p&gt;, &lt;ul&gt;, &lt;a&gt; ...</p>"></textarea></div>
<label style="display:flex;gap:8px;align-items:center;margin-bottom:16px;font-weight:600"><input type="checkbox" id="pPub" style="width:auto"> Published</label>
<button class="btn bp" id="pBtn">Save post</button> <button type="button" class="btn bl hid" id="pCancel">Cancel edit</button></form></div>
<div class="box"><h3>All posts <span class="bd" id="pCount"></span></h3><div style="overflow:auto"><table class="tbl"><thead><tr><th>Title</th><th>Site</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="pRows"></tbody></table></div></div></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},E=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var sb=supabase.createClient(NV.SUPABASE_URL,NV.SUPABASE_ANON_KEY),SOFT=[],POST=[];
function toast(m,t){var e=$('toast');e.textContent=m;e.className='on '+(t||'');clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=''},3200)}
function lines(v){return v.split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function fixUrl(u){return u.replace(/github\.com\/([^\/]+)\/([^\/]+)\/blob\//,'github.com/$1/$2/raw/')}
function show(s){$('login').classList.toggle('hid',!!s);$('app').classList.toggle('hid',!s);if(s){loadS();loadP()}}
sb.auth.getSession().then(function(r){show(r.data&&r.data.session)});sb.auth.onAuthStateChange(function(_,s){show(s)});
$('lf').onsubmit=function(e){e.preventDefault();sb.auth.signInWithPassword({email:$('le').value,password:$('lp').value}).then(function(r){if(r.error)toast('Login failed: '+r.error.message,'err')})};
$('out').onclick=function(){sb.auth.signOut()};
document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){document.querySelectorAll('[data-t]').forEach(function(x){x.classList.toggle('on',x==b)});document.querySelectorAll('.pn').forEach(function(p){p.classList.toggle('on',p.id=='p-'+b.dataset.t)})}});
/* ---------- Software ---------- */
function loadS(){sb.from('releases').select('*').order('released_at',{ascending:false}).then(function(r){if(r.error){toast('Could not load software','err');return}SOFT=r.data||[];$('sCount').textContent=SOFT.length;
$('sRows').innerHTML=SOFT.map(function(x){return'<tr><td><b>'+E(x.software_name||x.file_name)+'</b>'+(x.is_latest?' <span class="bd g">latest</span>':'')+'</td><td><span class="bd">'+E(x.category)+'</span></td><td>'+E(x.version)+'</td><td>'+(x.released_at||'').slice(0,10)+'</td><td><button class="bt" data-e="'+x.id+'">Edit</button><button class="bt d" data-d="'+x.id+'">Delete</button></td></tr>'}).join('')||'<tr><td colspan="5" style="color:var(--mu)">No releases yet.</td></tr>';
$('sRows').querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editS(b.dataset.e)}});$('sRows').querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Delete this release?'))sb.from('releases').delete().eq('id',b.dataset.d).then(function(r){r.error?toast('Delete failed','err'):(toast('Deleted','ok'),loadS())})}})})}
function resetS(){$('sf').reset();$('sId').value='';$('sT').textContent='Add software release';$('sBtn').textContent='Save release';$('sCancel').classList.add('hid')}
function editS(id){var x=SOFT.filter(function(r){return r.id==id})[0];if(!x)return;$('sId').value=x.id;$('sName').value=x.software_name||'';$('sCat').value=x.category||'other';$('sVer').value=x.version||'';$('sFile').value=x.file_name||'';$('sSize').value=x.file_size_mb||'';$('sDate').value=(x.released_at||'').slice(0,10);$('sUrl').value=x.download_url||'';$('sDesc').value=x.short_description||'';$('sFeat').value=(x.features||[]).join('\n');$('sReq').value=(x.requirements||[]).join('\n');$('sLat').checked=!!x.is_latest;$('sT').textContent='Edit release';$('sBtn').textContent='Update release';$('sCancel').classList.remove('hid');scrollTo({top:0,behavior:'smooth'})}
$('sCancel').onclick=resetS;
$('sf').onsubmit=function(e){e.preventDefault();var p={software_name:$('sName').value.trim(),category:$('sCat').value,version:$('sVer').value.trim(),file_name:$('sFile').value.trim(),file_size_mb:parseFloat($('sSize').value)||null,download_url:fixUrl($('sUrl').value.trim()),short_description:$('sDesc').value.trim(),features:lines($('sFeat').value),requirements:lines($('sReq').value),is_latest:$('sLat').checked};
if($('sDate').value)p.released_at=new Date($('sDate').value).toISOString();var id=$('sId').value;
(id?sb.from('releases').update(p).eq('id',id):sb.from('releases').insert(p)).then(function(r){if(r.error){console.error(r.error);toast('Could not save: '+r.error.message,'err');return}toast(id?'Release updated':'Release added','ok');resetS();loadS()})};
/* ---------- Posts ---------- */
function loadP(){sb.from('blog_posts').select('*').order('created_at',{ascending:false}).then(function(r){if(r.error){toast('Could not load posts','err');return}POST=r.data||[];$('pCount').textContent=POST.length;
$('pRows').innerHTML=POST.map(function(x){return'<tr><td><b>'+E(x.title)+'</b></td><td><span class="bd">'+E(x.site)+'</span></td><td><span class="bd '+(x.is_published?'g':'y')+'">'+(x.is_published?'published':'draft')+'</span></td><td>'+(x.created_at||'').slice(0,10)+'</td><td><button class="bt" data-e="'+x.id+'">Edit</button><button class="bt d" data-d="'+x.id+'">Delete</button></td></tr>'}).join('')||'<tr><td colspan="5" style="color:var(--mu)">No posts yet.</td></tr>';
$('pRows').querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editP(b.dataset.e)}});$('pRows').querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Delete this post?'))sb.from('blog_posts').delete().eq('id',b.dataset.d).then(function(r){r.error?toast('Delete failed','err'):(toast('Deleted','ok'),loadP())})}})})}
function resetP(){$('pf').reset();$('pId').value='';$('pT').textContent='Create post';$('pBtn').textContent='Save post';$('pCancel').classList.add('hid')}
function editP(id){var x=POST.filter(function(r){return r.id==id})[0];if(!x)return;$('pId').value=x.id;$('pTitle').value=x.title||'';$('pSlug').value=x.slug||'';$('pSite').value=x.site||'newvemo';$('pCat').value=x.category||'';$('pIcon').value=x.cover_icon||'package';$('pAuth').value=x.author_name||'';$('pRead').value=x.read_time_minutes||4;$('pExc').value=x.excerpt||'';$('pBody').value=x.content||'';$('pPub').checked=!!x.is_published;$('pT').textContent='Edit post';$('pBtn').textContent='Update post';$('pCancel').classList.remove('hid');document.querySelector('[data-t=post]').click();scrollTo({top:0,behavior:'smooth'})}
$('pCancel').onclick=resetP;
$('pTitle').oninput=function(){if(!$('pId').value)$('pSlug').value=$('pTitle').value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};
$('pf').onsubmit=function(e){e.preventDefault();var id=$('pId').value,old=POST.filter(function(r){return r.id==id})[0],pub=$('pPub').checked;
var p={title:$('pTitle').value.trim(),slug:$('pSlug').value.trim(),site:$('pSite').value,category:$('pCat').value.trim()||'news',cover_icon:$('pIcon').value,author_name:$('pAuth').value.trim()||'NewVemo Team',read_time_minutes:parseInt($('pRead').value)||4,excerpt:$('pExc').value.trim(),content:$('pBody').value,is_published:pub};
if(pub&&!(old&&old.published_at))p.published_at=new Date().toISOString();
(id?sb.from('blog_posts').update(p).eq('id',id):sb.from('blog_posts').insert(p)).then(function(r){if(r.error){console.error(r.error);toast('Could not save: '+r.error.message,'err');return}toast(id?'Post updated':'Post saved','ok');resetP();loadP()})};
})();
</script></body></html>
